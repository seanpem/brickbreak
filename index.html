<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <meta name="viewport" content="width=device-width, initial-scale=1.0" />
        <title>Brick Breaker</title>
        <link rel="icon" type="image/png" href="assets/point.png" />
        <style>
            body {
                margin: 0;
                background: #f5f0e8;
                display: flex;
                justify-content: center;
                align-items: center;
                height: 100vh;
            }
            #auth-container {
                display: flex;
                flex-direction: column;
                align-items: center;
                justify-content: center;
                position: absolute;
                inset: 0;
                z-index: 10;
                background: #f5f0e8;
            }
            #auth-container h1 {
                font-family: Arial, sans-serif;
                color: #151515;
                margin-bottom: 24px;
            }
            #login-form,
            #signup-form {
                display: flex;
                flex-direction: column;
                gap: 12px;
                width: 300px;
            }
            #login-form input,
            #signup-form input {
                padding: 10px 12px;
                font-size: 16px;
                border: 2px solid #ccc;
                border-radius: 8px;
                outline: none;
                font-family: Arial, sans-serif;
            }
            #login-form input:focus,
            #signup-form input:focus {
                border-color: #151515;
            }
            .btn-primary {
                padding: 10px;
                font-size: 16px;
                border: none;
                border-radius: 8px;
                cursor: pointer;
                font-family: Arial, sans-serif;
                font-weight: bold;
                background: #151515;
                color: #f5f0e8;
            }
            .auth-error {
                color: #d32f2f;
                font-family: Arial, sans-serif;
                font-size: 14px;
                min-height: 20px;
                text-align: center;
            }
            .auth-switch {
                font-family: Arial, sans-serif;
                font-size: 14px;
                color: #666;
                text-align: center;
                margin: 4px 0 0;
            }
            .auth-switch a {
                color: #151515;
                font-weight: bold;
                text-decoration: none;
            }
            #logout-btn {
                display: none;
                position: fixed;
                top: 8px;
                right: 12px;
                z-index: 20;
                padding: 6px 14px;
                font-size: 13px;
                background: #151515;
                color: #f5f0e8;
                border: none;
                border-radius: 6px;
                cursor: pointer;
                font-family: Arial, sans-serif;
            }
            #posthog-brickbreak {
                display: none;
            }
        </style>
        <script>

    </head>
    <body>
        <div id="auth-container">
            <h1>Brick Breaker</h1>
            <form id="login-form" onsubmit="return false;">
                <input
                    type="email"
                    id="login-email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                />
                <input
                    type="password"
                    id="login-password"
                    placeholder="Password"
                    autocomplete="current-password"
                    required
                />
                <button type="button" id="login-btn" class="btn-primary">
                    Log In
                </button>
                <div id="login-error" class="auth-error"></div>
                <p class="auth-switch">
                    Don't have an account?
                    <a href="#" id="show-signup">Sign Up</a>
                </p>
            </form>
            <form
                id="signup-form"
                style="display: none"
                onsubmit="return false;"
            >
                <input
                    type="email"
                    id="signup-email"
                    placeholder="Email"
                    autocomplete="email"
                    required
                />
                <input
                    type="password"
                    id="signup-password"
                    placeholder="Password"
                    autocomplete="new-password"
                    required
                />
                <input
                    type="password"
                    id="signup-confirm-password"
                    placeholder="Confirm Password"
                    autocomplete="new-password"
                    required
                />
                <button type="button" id="signup-btn" class="btn-primary">
                    Sign Up
                </button>
                <div id="signup-error" class="auth-error"></div>
                <p class="auth-switch">
                    Already have an account?
                    <a href="#" id="show-login">Log In</a>
                </p>
            </form>
        </div>
        <button id="logout-btn">Log out</button>
        <div id="posthog-brickbreak"></div>
        <div
            style="
                position: fixed;
                bottom: 4px;
                right: 8px;
                font-size: 10px;
                color: #999;
            "
        >
            <a
                href="https://www.flaticon.com/free-icons/hourglass"
                title="hourglass icons"
                style="color: #999; text-decoration: none"
                >Hourglass icons created by Those Icons - Flaticon</a
            >
            |
            <a
                href="https://www.flaticon.com/free-icons/countdown"
                title="countdown icons"
                style="color: #999; text-decoration: none"
                >Countdown icons created by Ramy W. - Flaticon</a
            >
            |
            <a
                href="https://www.flaticon.com/free-icons/expand-arrows"
                title="expand arrows icons"
                style="color: #999; text-decoration: none"
                >Expand arrows icons created by Icon mania - Flaticon</a
            >
            |
            <a
                href="https://www.flaticon.com/free-icons/bomb"
                title="bomb icons"
                style="color: #999; text-decoration: none"
                >Bomb icons created by Freepik - Flaticon</a
            >
        </div>
        <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
        <script src="lib/phaser.min.js"></script>
        <script src="main.js"></script>
        <script src="auth.js"></script>
        <script>
            function initPostHog() {
                posthog.init(
                    "phc_u4BweJgjTsMqeEdFQLkngcG6DFyDK6ZBS8QkfmG27x6c",
                    {
                        api_host: "https://us.i.posthog.com",
                        defaults: "2026-01-30",
                        person_profiles: "identified_only",
                        session_recording: {
                            captureCanvas: {
                                canvasFps: 4,
                                canvasQuality: "0.6",
                            },
                            maskAllInputs: false,
                            maskTextSelector: "",
                        },
                    },
                );
            }

            game.events.on("ready", initPostHog);
        </script>
    </body>
</html>
